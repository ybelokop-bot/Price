header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

const dRu=iso=>iso?iso.split('-').reverse().join('.'):'';
const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- состояние ---------- */

let S=LS.get('gws_cart',null)||newCart();
if(!S.cd)S.cd={};if(!S.cl)S.cl=newCart().cl;

let view='';
const DEF_TIERS='1-я заявка;0;0\n2-я заявка;0;0\n3-я заявка;0;0\nОт 500 000 ₸;0;500000';
const SET=()=>Object.assign({mname:'',mphone:'',days:7,tiers:DEF_TIERS,cnt:0},LS.get('gws_set',{}));
const saveSet=s=>LS.set('gws_set',s);
const persist=()=>LS.set('gws_cart',S);
function tiers(){return SET().tiers.split('\n').map(l=>l.split(';').map(x=>x.trim())).filter(a=>a[0]).map(a=>({label:a[0],pct:parseFloat((a[1]||'0').replace(',','.'))||0,min:parseFloat(a[2])||0}))}

/* ---------- расчёт ---------- */
const clampP=x=>{x=parseFloat(String(x).replace(',','.'));return isNaN(x)?0:Math.min(100,Math.max(0,x))};
function hasLD(l){return l.d!==''&&l.d!=null&&!isNaN(parseFloat(String(l.d).replace(',','.')))}
function lineDisc(l){if(hasLD(l))return clampP(l.d);const c=S.cd[l.c];if(c!=null&&c!=='')return clampP(c);return clampP(S.gd)}
const unit=l=>Math.round(l.p*(1-lineDisc(l)/100));
function tot(){let base=0,sum=0,n=0;S.lines.forEach(l=>{base+=l.p*l.q;sum+=unit(l)*l.q;n+=l.q});return{base,sum,save:base-sum,n}}

/* ---------- каталог ---------- */
let cat='';
function cats(){
  const cnt={};D.forEach(d=>cnt[d.c]=(cnt[d.c]||0)+1);
  let h='<button class="chip on" data-c="">Все<small>'+D.length+'</small></button>';
  ORDER.filter(c=>cnt[c]).forEach(c=>h+='<button class="chip" data-c="'+c+'">'+c+'<small>'+cnt[c]+'</small></button>');
  $('cats').innerHTML=h;
  $('cats').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render();};
  const cs=[...new Set(D.map(d=>d.ct).filter(Boolean))].sort();
  $('ctry').innerHTML+=cs.map(c=>'<option>'+c+'</option>').join('');
  const ts=[...new Set(D.map(d=>d.t.toLowerCase()).filter(Boolean))].sort();
  $('typ').innerHTML+=ts.map(t=>'<option>'+t+'</option>').join('');
}
const tagCls=t=>{t=t.toLowerCase();return t.startsWith('красн')?'red':t.startsWith('бел')?'white':t.startsWith('роз')?'rose':''};
function ctlInner(k){const l=S.lines.find(x=>x.k===k);
  return l?'<div class="step"><button data-a="dec" data-k="'+k+'">−</button><b>'+l.q+'</b><button data-a="inc" data-k="'+k+'">+</button></div>'
          :'<button class="add" data-a="add" data-k="'+k+'">+ В КП</button>'}
function render(){
  const q=$('q').value.trim().toLowerCase(),ct=$('ctry').value,ty=$('typ').value,so=$('sort').value;
  let r=D.filter(d=>(!cat||d.c===cat)&&(!ct||d.ct===ct)&&(!ty||d.t.toLowerCase()===ty)&&
    (!q||(d.n+' '+d.r+' '+d.g+' '+d.rg+' '+d.t+' '+d.ct).toLowerCase().includes(q)));
  if(so==='1')r=[...r].sort((a,b)=>a.p-b.p);if(so==='2')r=[...r].sort((a,b)=>b.p-a.p);
  $('count').textContent='Позиций: '+r.length+' из '+D.length;
  if(!r.length){$('list').innerHTML='<div class="empty">Ничего не найдено</div>';return}
  let h='',last='';
  r.forEach(d=>{
    if(so==='0'){const k=d.c+'|'+d.g;if(k!==last){last=k;const lab=(cat?'':d.c+(d.g?' · ':''))+(d.g||'');if(lab)h+='<div class="grp">'+esc(lab)+'</div>'}}
    const tags=[];
    if(so!=='0'&&d.g&&d.c!=='Спецпредложение')tags.push('<span class="tag">'+esc(d.g)+'</span>');
    if(d.v)tags.push('<span class="tag">'+volS(d.v)+'</span>');
    if(d.a)tags.push('<span class="tag">'+d.a+'</span>');
    if(d.t)tags.push('<span class="tag '+tagCls(d.t)+'">'+esc(d.t.toLowerCase())+'</span>');
    if(d.rg)tags.push('<span class="tag">'+esc(d.rg)+'</span>');
    if(d.ct&&!cat)tags.push('<span class="tag">'+esc(d.ct)+'</span>');
    h+='<div class="item"><div><div class="nm" data-a="card" data-k="'+d.k+'">'+esc(d.n)+'</div>'+(d.r?'<div class="ru">'+esc(d.r)+'</div>':'')+
       (tags.length?'<div class="meta">'+tags.join('')+'</div>':'')+'</div><div class="pr">'+fmt(d.p)+'<span data-ctl="'+d.k+'">'+ctlInner(d.k)+'</span></div></div>';
  });
  $('list').innerHTML=h;
}

function setQty(k,q){const i=S.lines.findIndex(x=>x.k===k);if(i<0)return;if(q<=0)S.lines.splice(i,1);else S.lines[i].q=q;persist();refreshCtl(k);updBar()}

  const el=ov.querySelector('#tot');if(el)el.innerHTML=totHtml(tot());hint();updBar();persist()}

function saveCurrent(silent){
  const set=SET(),all=LS.get('gws_saved',[]);
  if(!S.id)S.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if(!S.no){set.cnt=(set.cnt||0)+1;saveSet(set);S.no='КП-'+new Date().getFullYear()+'-'+pad(set.cnt,3)}
  const rec=clone(S);rec.total=tot().sum;rec.upd=Date.now();
  const i=all.findIndex(x=>x.id===S.id);if(i>=0)all[i]=rec;else all.unshift(rec);
  LS.set('gws_saved',all);persist();if(!silent)toast('Сохранено: '+S.no)}

function copyText(t,msg){const done=()=>toast(msg||'Скопировано');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fb());else fb();
  function fb(){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Не удалось скопировать')}a.remove()}}
function kpLink(){const m=mgrInfo(),o={t:S.type,l:S.lines.map(l=>[l.k,l.q,l.d,l.p]),gd:S.gd,cd:S.cd,cl:S.cl,no:S.no,dt:S.date,m};
  return location.href.split('#')[0]+'#kp='+b64(JSON.stringify(o))}
function loadKp(code){try{const o=JSON.parse(unb64(code));const n=newCart(o.t);
  o.l.forEach(a=>{const d=BYK[a[0]];if(d)n.lines.push({k:d.k,n:d.n,r:d.r,v:d.v,c:d.c,p:a[3]||d.p,q:a[1],d:a[2]})});
  n.gd=o.gd||0;n.cd=o.cd||{};n.cl=Object.assign(n.cl,o.cl||{});n.no=o.no||'';n.date=o.dt||todayISO();
  if(S.lines.length&&!S.id)saveCurrent(true);S=n;persist();return true}catch(e){return false}}
function waPhone(){let p=(S.type==='b2b'&&MGR&&S.cl.phone?S.cl.phone:ORDER_PHONE).replace(/\D/g,'');if(p.length===11&&p[0]==='8')p='7'+p.slice(1);if(p.length===10)p='7'+p;return p}
function doPrint(){$('pd').innerHTML=docHtml();window.print()}

/* ---------- события ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,k=el.dataset.k;
  const cartRefresh=()=>{persist();updBar();refreshCtl(k);viewCart()};
  switch(a){
   case'add':addItem(k);if(view==='card')toast('Добавлено в корзину');break;
   case'inc':setQty(k,(S.lines.find(x=>x.k===k)||{q:0}).q+1);break;
   case'dec':setQty(k,(S.lines.find(x=>x.k===k)||{q:0}).q-1);break;
   case'cinc':{const l=S.lines.find(x=>x.k===k);if(l){l.q++;cartRefresh()}break}
   case'cdec':{const l=S.lines.find(x=>x.k===k);if(l){l.q--;if(l.q<=0)S.lines=S.lines.filter(x=>x!==l);cartRefresh()}break}
   case'del':S.lines=S.lines.filter(x=>x.k!==k);cartRefresh();break;
   case'card':viewCard(k);break;
   case'cart':viewCart();break;
   case'close':closeOv();break;
   case'type':S.type=el.dataset.t;persist();viewCart();break;
   case'cpos':{const d=BYK[k];copyText(d.n+(d.v?' '+volS(d.v):'')+' — '+fx(d.p));break}
   case'cposl':copyText(location.href.split('#')[0]+'#i='+k,'Ссылка скопирована');break;
   case'wa':{const p=waPhone();window.open('https://wa.me/'+(p||'')+'?text='+encodeURIComponent(docText()),'_blank');break}
   case'copytxt':copyText(docText());break;
   case'link':copyText(kpLink(),'Ссылка скопирована');break;
   case'pdf':doPrint();break;
   case'clear':S=newCart(S.type);persist();D.forEach(d=>refreshCtl(d.k));closeOv();break;
   case'mgr':e.preventDefault();viewMgr();break;
   case'pinok':{const v=$('pin').value.trim(),has=LS.get('gws_pin',null);
     if(!has){if(!/^\d{4,6}$/.test(v)){$('pe').textContent='PIN: 4–6 цифр';break}LS.set('gws_pin',pinKey(v))}
     else if(has!==pinKey(v)){$('pe').textContent='Неверный PIN';break}
     MGR=true;try{sessionStorage.setItem('gws_m','1')}catch(x){}viewMgr();break}
   case'mout':MGR=false;try{sessionStorage.removeItem('gws_m')}catch(x){}closeOv();break;
   case'pinchg':try{localStorage.removeItem('gws_pin')}catch(x){}MGR=false;viewPin();break;
   case'newkp':S=newCart(S.type);persist();D.forEach(d=>refreshCtl(d.k));viewCart();break;
   case'save':saveCurrent();break;
   case'kopen':{const r=LS.get('gws_saved',[]).find(x=>x.id===el.dataset.id);if(r){S=clone(r);persist();D.forEach(d=>refreshCtl(d.k));viewCart()}break}
   case'kdup':{const all=LS.get('gws_saved',[]),r=all.find(x=>x.id===el.dataset.id);if(r){const n=clone(r);n.id=Date.now().toString(36);n.no='';n.status='draft';n.date=todayISO();S=n;persist();D.forEach(d=>refreshCtl(d.k));viewCart()}break}
   case'kdel':{LS.set('gws_saved',LS.get('gws_saved',[]).filter(x=>x.id!==el.dataset.id));viewMgr();break}
   case'kexp':{const blob=new Blob([JSON.stringify(LS.get('gws_saved',[]),null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),a2=document.createElement('a');a2.href=u;a2.download='GWS_KP_'+todayISO()+'.json';document.body.appendChild(a2);a2.click();a2.remove();break}
   case'kimp':$('kfile').click();break;
   case'cdset':{const c=$('ccat').value,p=$('cpct').value;if(c&&p!==''){S.cd[c]=clampP(p);persist();viewCart()}break}
   case'cddel':delete S.cd[el.dataset.c];persist();viewCart();break;
   case'tapply':{const t=tiers().find(x=>x.label===el.dataset.l);if(t){S.gd=t.pct;S.tier=t.label;persist();viewCart()}break}
  }
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='gd'){S.gd=el.value===''?0:clampP(el.value);S.tier='';paint()}
  else if(a==='ld'){const l=S.lines.find(x=>x.k===el.dataset.k);if(l){l.d=el.value===''?'':clampP(el.value);paint()}}
  else if(a==='f'){S.cl[el.dataset.f]=el.value;persist()}
  else if(a==='set'){const s=SET();s[el.dataset.s]=el.value;saveSet(s)}
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='tier'){const t=tiers().find(x=>x.label===el.value);S.tier=el.value;if(t){S.gd=t.pct;}persist();viewCart()}
  else if(a==='kst'){const all=LS.get('gws_saved',[]),r=all.find(x=>x.id===el.dataset.id);if(r){r.status=el.value;LS.set('gws_saved',all)}}
  else if(el.id==='kfile'){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const arr=JSON.parse(rd.result),all=LS.get('gws_saved',[]);arr.forEach(r=>{const i=all.findIndex(x=>x.id===r.id);if(i>=0)all[i]=r;else all.push(r)});LS.set('gws_saved',all);toast('Загружено: '+arr.length);viewMgr()}catch(x){toast('Файл не подходит')}};rd.readAsText(f)}
});
['q','ctry','typ','sort'].forEach(i=>$(i).addEventListener('input',render));
cats();render();updBar();
(function route(){const h=location.hash;
  if(h.startsWith('#kp=')){if(loadKp(h.slice(4))){D.forEach(d=>refreshCtl(d.k));viewCart()}else toast('Ссылка повреждена')}
  else if(h.startsWith('#i=')){viewCard(h.slice(3))}
})();

</script></body></html>
